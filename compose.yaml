services:
  mysql:
    image: mysql:8.4
    container_name: flashpay-mysql
    environment:
      MYSQL_DATABASE: flashpay
      MYSQL_ROOT_PASSWORD: root
      TZ: Asia/Seoul
    ports:
      - "23306:3306"
    volumes:
      - mysql-data:/var/lib/mysql

  redis:
    image: redis:7.4
    container_name: flashpay-redis
    ports:
      - "6379:6379"

  kafka:
    image: apache/kafka:4.1.0
    container_name: flashpay-kafka
    ports:
      - "9092:9092"

volumes:
  mysql-data:
